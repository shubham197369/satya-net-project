<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 280px; font-family: Arial, sans-serif; padding: 12px; background: #f9f9f9; margin: 0; }
        h3 { color: #333; margin-top: 0; text-align: center; font-size: 15px; }
        .tab-container { display: flex; margin-bottom: 10px; border-radius: 4px; overflow: hidden; border: 1px solid #ccc; }
        .tab-btn { flex: 1; padding: 6px; cursor: pointer; border: none; font-weight: bold; font-size: 11px; background: #e0e0e0; text-align: center; }
        .tab-btn.active { background: #007bff; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        textarea { width: 100%; height: 70px; margin-bottom: 8px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; resize: none; box-sizing: border-box; font-size: 12px; }
        input[type="file"] { width: 100%; margin-bottom: 8px; font-size: 11px; }
        button.action-btn { width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        button.action-btn:hover { background: #0056b3; }
        #result { margin-top: 10px; font-size: 11px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #ddd; word-break: break-word; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>
    <h3>Satya-Net Pro</h3>
    
    <!-- Tabs -->
    <div class="tab-container">
        <button class="tab-btn active" id="textTabBtn">Text Claim</button>
        <button class="tab-btn" id="imageTabBtn">Image</button>
        <button class="tab-btn" id="audioTabBtn">Audio</button>
    </div>

    <!-- Text Verification Section -->
    <div id="text-section" class="section active">
        <textarea id="userInput" placeholder="Yahan koi bhi claim ya text daalein..."></textarea>
        <button class="action-btn" id="checkBtn">Verify Claim</button>
    </div>

    <!-- Image Verification Section -->
    <div id="image-section" class="section">
        <input type="file" id="imageFile" accept="image/*">
        <button class="action-btn" id="checkImageBtn">Verify Image</button>
    </div>

    <!-- Audio Verification Section -->
    <div id="audio-section" class="section">
        <input type="file" id="audioFile" accept="audio/*">
        <button class="action-btn" id="checkAudioBtn">Verify Audio</button>
    </div>

    <div id="result">Result yahan dikhega...</div>

    <script src="popup.js"></script>
</body>
</html>
