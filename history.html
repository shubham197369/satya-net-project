<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification History | Satya-Net</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-black/60 border-b border-purple-500/20 px-6 py-4 flex justify-between items-center backdrop-blur-md">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold text-purple-400">SATYA-NET</span>
        </div>
        <div class="space-x-6 text-sm">
            <a href="dashboard.html" class="hover:text-purple-400 transition">Home Hub</a>
            <a href="history.html" class="text-purple-400 font-semibold border-b-2 border-purple-400 pb-1">History</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-6 mt-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-white">📜 Verification & Activity History</h2>
                <p class="text-gray-400 text-sm mt-1">Aapke sabhi pichle text claims, image forensics, aur audio scans ka record.</p>
            </div>
            <button onclick="clearHistoryLogs()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm transition shadow-lg shadow-red-600/20">Clear All History</button>
        </div>
        
        <!-- History Cards Container -->
        <div id="history-container" class="space-y-3">
            <p class="text-gray-400 text-center py-8">Loading history...</p>
        </div>
    </div>

    <script>
        // Backend se history fetch karne ka function
        async function loadHistory() {
            try {
                // FIXED: Using relative path '' instead of hardcoded 'http://127.0.0.1:8000'
                let response = await fetch('/api/history');
                let data = await response.json();
                let container = document.getElementById('history-container');
                
                if(data.history && data.history.length > 0) {
                    container.innerHTML = data.history.map(item => `
                        <div class="p-4 bg-black/40 border border-purple-500/20 rounded-xl flex justify-between items-center hover:border-purple-500/40 transition">
                            <div class="space-y-1">
                                <span class="text-xs px-2.5 py-1 bg-purple-900/60 text-purple-300 rounded-full font-medium">${item.type}</span>
                                <p class="text-white font-medium mt-2">${item.query}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-gray-400 block mb-1">Verdict</span>
                                <span class="text-sm text-purple-300 font-bold">${item.verdict}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="text-center py-12 bg-black/20 border border-white/5 rounded-xl"><p class="text-gray-400">No history records found yet.</p></div>';
                }
            } catch (err) {
                console.error("Error loading history:", err);
                document.getElementById('history-container').innerHTML = '<p class="text-red-400 text-center">Backend server se connect karne me samasya aayi.</p>';
            }
        }

        // History clear karne ka function
        async function clearHistoryLogs() {
            if(confirm("Kya aap apni saari history delete karna chahte hain?")) {
                try {
                    // FIXED: Using relative path '' instead of hardcoded 'http://127.0.0.1:8000'
                    await fetch('/api/history/clear', { method: 'DELETE' });
                    loadHistory();
                } catch(err) {
                    alert("History clear karne me error aaya.");
                }
            }
        }

        // Page load hote hi history load ho jayegi
        window.onload = loadHistory;
    </script>
</body>
</html>
